name: Python Cloud CI-CD Deployment

on:
  push:
    branches: [ "main" ] # Kích hoạt tự động khi push code vào nhánh main

jobs:
  test-and-build:
    runs-on: ubuntu-latest # Chạy trên máy ảo Ubuntu miễn phí của GitHub

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint with flake8 (Quet loi cu phap)
      run: |
        pip install flake8
        # Dừng tiến trình và báo đỏ nếu phát hiện lỗi cú pháp nghiêm trọng
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics